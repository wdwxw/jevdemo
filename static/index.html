<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeSafe · 结构化判断 Demo</title>
  <style>
    :root { --ink:#172033; --muted:#65708a; --line:#e4e8f0; --blue:#3757e8; --blue-soft:#eef1ff; --green:#15956d; --amber:#d98b18; --bg:#f6f8fc; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; }
    .shell { max-width:1120px; margin:0 auto; padding:44px 22px 70px; }
    .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:28px; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:7px 0 8px; font-size:clamp(30px,5vw,48px); line-height:1.08; letter-spacing:-.04em; } .hero p { max-width:650px; margin:0; color:var(--muted); font-size:16px; }
    .badge { padding:7px 12px; border:1px solid #cfd6ff; border-radius:999px; color:var(--blue); background:white; white-space:nowrap; font-size:12px; font-weight:700; }
    .panel { border:1px solid var(--line); border-radius:22px; background:#fff; box-shadow:0 16px 45px #24376d0d; }
    .input-panel { padding:24px; } label { display:block; margin-bottom:9px; font-size:13px; font-weight:800; } textarea { width:100%; min-height:140px; resize:vertical; padding:15px; border:1px solid #d8deea; border-radius:13px; color:var(--ink); background:#fbfcff; font:inherit; outline:none; } textarea:focus { border-color:var(--blue); box-shadow:0 0 0 4px #3757e812; }
    .presets { display:flex; flex-wrap:wrap; gap:8px; margin:13px 0 20px; } button { cursor:pointer; border:0; font:inherit; } .preset { padding:8px 12px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:white; font-size:13px; } .preset:hover { border-color:var(--blue); color:var(--blue); }
    .row { display:flex; gap:12px; align-items:end; } .custom { flex:1; } input { width:100%; padding:12px 13px; border:1px solid #d8deea; border-radius:11px; font:inherit; outline:none; } input:focus { border-color:var(--blue); }
    .run { padding:12px 22px; border-radius:11px; color:white; background:var(--blue); font-weight:800; box-shadow:0 7px 16px #3757e833; } .run:disabled { opacity:.55; cursor:wait; }
    .hint { margin:10px 0 0; color:var(--muted); font-size:12px; }
    #status { min-height:24px; margin:18px 2px 0; color:var(--muted); font-size:13px; } #status.error { color:#c33c4b; }
    #results { display:none; margin-top:22px; } .result-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; } h2 { margin:0; font-size:22px; } .model { color:var(--muted); font-size:12px; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; } .card { padding:19px; border:1px solid var(--line); border-radius:17px; background:#fff; } .card.custom-card { border-color:#cad3ff; background:#fafbff; } .card-title { color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.04em; } .answer { margin:7px 0 14px; font-size:25px; font-weight:850; letter-spacing:-.03em; } .answer.good { color:var(--green); } .answer.warn { color:var(--amber); } .metric { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; } .bar { height:7px; overflow:hidden; margin:5px 0 11px; border-radius:8px; background:#edf0f6; } .bar i { display:block; height:100%; border-radius:inherit; background:var(--blue); } .probabilities { margin-top:12px; } .prob-row { margin:6px 0; } .prob-row .metric { color:var(--ink); }
    .meta { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; } .meta span { padding:5px 9px; border-radius:8px; color:var(--muted); background:var(--bg); font-size:12px; }
    details { margin-top:16px; } summary { cursor:pointer; color:var(--blue); font-size:13px; font-weight:700; } pre { max-height:330px; overflow:auto; padding:15px; border-radius:12px; color:#dce5ff; background:#182037; font:12px/1.55 ui-monospace,SFMono-Regular,monospace; }
    .feedback { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-top:15px; padding:17px 19px; border:1px solid var(--line); border-radius:16px; background:#fff; } .feedback strong { font-size:14px; } .feedback small { display:block; color:var(--muted); } .feedback-actions { display:flex; gap:8px; } .feedback button { padding:9px 15px; border:1px solid var(--line); border-radius:9px; background:white; } .feedback button.selected { border-color:var(--blue); color:var(--blue); background:var(--blue-soft); }
    @media (max-width:760px) { .hero,.feedback { display:block; } .badge { display:inline-block; margin-top:17px; } .cards { grid-template-columns:1fr; } .row { display:block; } .run { width:100%; margin-top:12px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><div><div class="eyebrow">TypeSafe · System One</div><h1>让 AI 的判断，直接变成程序能用的结果。</h1><p>输入一段真实内容，Jev 会同时回答多个窄问题，并返回选择、评分、概率与置信度。没有聊天气泡，只有可执行的结构化判断。</p></div><div class="badge">jev-latest · live API</div></header>
    <section class="panel input-panel"><label for="state">待判断内容 <span style="color:var(--muted);font-weight:400">State</span></label><textarea id="state" placeholder="粘贴客服消息、评论、申请或任意需要判断的文本……"></textarea><div class="presets"><button class="preset" data-preset="urgent">客服工单 · 紧急故障</button><button class="preset" data-preset="calm">客服工单 · 普通咨询</button><button class="preset" data-preset="angry">客服工单 · 愤怒投诉</button></div><div class="row"><div class="custom"><label for="custom">自定义问题 <span style="color:var(--muted);font-weight:400">可选，作为 Noul 判断</span></label><input id="custom" placeholder="例如：是否应该升级给人工主管？"></div><button class="run" id="run">运行 TypeSafe 判断 →</button></div><p class="hint">每次请求固定演示 Choice、Score、Noul；自定义问题会作为第 4 个问题并行执行。</p></section>
    <div id="status"></div>
    <section id="results"><div class="result-head"><h2>模型判断结果</h2><span class="model" id="model"></span></div><div class="cards" id="cards"></div><div class="meta" id="meta"></div><details><summary>查看 API 原始 JSON</summary><pre id="raw"></pre></details><div class="feedback"><div><strong>这个判断对你来说正确吗？</strong><small>反馈只保存在当前页面，用于演示人机协作闭环。</small></div><div class="feedback-actions"><button data-feedback="correct">✓ 正确</button><button data-feedback="wrong">× 不正确</button></div></div></section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s); const state = $('#state'); const status = $('#status'); const results = $('#results'); const cards = $('#cards');
    let presets = {};
    fetch('/api/presets').then(r => r.json()).then(v => presets = v);
    document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { state.value = presets[b.dataset.preset] || ''; });
    function esc(v) { return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function pct(v) { return `${Math.round(Number(v) * 100)}%`; }
    function probabilityRows(values) { return Object.entries(values || {}).map(([k,v]) => `<div class="prob-row"><div class="metric"><span>${esc(k)}</span><b>${pct(v)}</b></div><div class="bar"><i style="width:${Math.max(0, Math.min(100, Number(v)*100))}%"></i></div></div>`).join(''); }
    function card(title, answer, sub, body, cls='') { return `<article class="card ${cls}"><div class="card-title">${title}</div><div class="answer ${cls ? 'good' : ''}">${answer}</div><div class="metric"><span>${sub}</span></div>${body}</article>`; }
    function render(data) {
      const a = data.answers || {}; let html = '';
      if (a.department) html += card('CHOICE · 路由判断', esc(a.department.choice), `置信度 ${pct(a.department.confidence)}`, `<div class="probabilities">${probabilityRows(a.department.probabilities)}</div>`);
      if (a.frustration) html += card('SCORE · 情绪强度', `${esc(a.frustration.score)} / 2`, `置信度 ${pct(a.frustration.confidence)}`, `<div class="probabilities">${probabilityRows(a.frustration.probabilities)}</div>`);
      if (a.is_urgent) html += card('NOUL · 是否紧急', pct(a.is_urgent.noul), 'Yes 概率', `<div class="bar"><i style="width:${Number(a.is_urgent.noul)*100}%"></i></div>`);
      if (a.custom_judgment) html += card('自定义 NOUL · 是/否', pct(a.custom_judgment.noul), 'Yes 概率', `<div class="bar"><i style="width:${Number(a.custom_judgment.noul)*100}%"></i></div>`, 'custom-card');
      cards.innerHTML = html; $('#model').textContent = `实际模型：${data.model || '—'}`; $('#meta').innerHTML = `<span>输入 ${data.usage?.input_tokens ?? '—'} tokens</span><span>输出 ${data.usage?.output_tokens ?? '—'} tokens</span><span>一次请求 · 并行问题</span>`; $('#raw').textContent = JSON.stringify(data, null, 2); results.style.display = 'block'; results.scrollIntoView({behavior:'smooth', block:'start'});
    }
    $('#run').onclick = async () => { if (!state.value.trim()) { status.textContent = '请先输入或选择一段待判断内容。'; status.className='error'; return; } const btn=$('#run'); btn.disabled=true; status.className=''; status.textContent='正在请求 Jev，多个问题会并行判断……'; try { const r=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:state.value,custom_question:$('#custom').value})}); const data=await r.json(); if(!r.ok) throw new Error(data.detail || '请求失败'); render(data); status.textContent='完成：结果来自 TypeSafe System One API。'; } catch(e) { status.textContent=`请求失败：${e.message}`; status.className='error'; } finally { btn.disabled=false; } };
    document.querySelectorAll('[data-feedback]').forEach(b => b.onclick=()=>{ document.querySelectorAll('[data-feedback]').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); });
  </script>
</body>
</html>
